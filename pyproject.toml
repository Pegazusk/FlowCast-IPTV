[project]
name = "flowcast-backend"
version = "0.1.0"
description = "Backend de FlowCast: API para la app (cuentas, perfiles, conexiones Xtream, favoritos e historial)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "cryptography>=50.0.2",
    "httpx2>=2.13.1",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_functions = ["prueba_*"]
python_classes = ["Prueba*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"app/services/cache.py" = ["BLE001"]
